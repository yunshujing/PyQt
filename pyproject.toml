[project]
name = "pyqt-coursework"
version = "0.1.0"
description = "Python 程序设计基础练习"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"work1/*.py" = ["E501"]
"work2/*.py" = ["E501"]
"work3/*.py" = ["E501"]
"work4/*.py" = ["E501"]
"class/*.py" = ["E501"]
